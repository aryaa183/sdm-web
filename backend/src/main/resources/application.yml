spring:
  application:
    name: sdm-backend

  datasource:
    url: jdbc:h2:mem:sdmdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  h2:
    console:
      enabled: true
      path: /h2-console

server:
  port: 8080

# Allow the Vite dev server to call this API during local development
cors:
  allowed-origins: http://localhost:5173,http://127.0.0.1:5173
